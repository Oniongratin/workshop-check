<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="창신체크미" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>창신체크미</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color-scheme:dark;--bg:#000;--line:#292929;--text:#fff;--muted:#85858b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);min-height:100%}body{min-height:100svh}button,input,select{font:inherit}.app{max-width:640px;margin:auto;padding:max(18px,env(safe-area-inset-top)) 18px calc(92px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{display:flex;gap:12px;align-items:center}.mark{width:52px;height:52px;border:1px solid #333;border-radius:15px;background:#080808;display:grid;place-items:center;overflow:hidden}.mark svg{width:41px;height:41px}.title h1{font-size:22px;margin:0;letter-spacing:-.055em}.title p{font-size:12px;color:var(--muted);margin:4px 0 0;letter-spacing:.01em}.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#090909;color:#fff;display:grid;place-items:center;padding:0}.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.hero{text-align:center;padding:7px 0 28px}.percent{font-size:72px;font-weight:760;letter-spacing:-.075em;line-height:1}.percent small{font-size:30px;margin-left:4px}.sub{margin-top:10px;color:var(--muted);font-size:15px}.journey{position:relative;margin:26px 0 8px;padding-top:22px}.journey-icons{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;color:#d8d8dc}.journey-icons svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.bar{height:7px;background:#272727;border-radius:999px;overflow:hidden}.fill{height:100%;background:#fff;width:0;transition:width .35s cubic-bezier(.2,.8,.2,1)}.bar-label{display:flex;justify-content:space-between;color:#707075;font-size:12px;margin-top:8px}.section-title{font-size:13px;color:#79797e;margin:20px 0 8px}.list{border-top:1px solid var(--line)}.item{width:100%;display:flex;align-items:center;gap:14px;padding:17px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;color:white;text-align:left}.item:active{opacity:.55}.item-icon{width:30px;text-align:center;font-size:19px}.item-main{flex:1;display:flex;align-items:baseline;min-width:0}.item-name{font-size:16px;font-weight:620;letter-spacing:-.035em;white-space:nowrap}.item-meta{font-size:12px;color:var(--muted);margin-left:3pt;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.state{width:25px;height:25px;border-radius:50%;border:1.5px solid #555;display:grid;place-items:center;font-size:14px;flex:none}.item.done .state{border-color:white;background:white;color:black}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}.control{border:1px solid var(--line);border-radius:14px;padding:14px;background:#0b0b0b;color:white;font-weight:650}.control.primary{background:white;color:black;border-color:white}.hidden{display:none!important}.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);backdrop-filter:blur(20px);border-top:1px solid #1d1d1d;padding:9px 16px calc(9px + env(safe-area-inset-bottom))}.tabs-in{max-width:640px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.tab{border:0;background:transparent;color:#67676c;padding:8px;font-size:12px}.tab svg{display:block;width:20px;height:20px;margin:0 auto 4px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.tab.active{color:white}.view{display:none}.view.active{display:block}.card{border:1px solid var(--line);border-radius:18px;padding:16px;background:#0b0b0b;margin-bottom:12px}.card h3{margin:0;font-size:16px}.card p{color:var(--muted);font-size:13px;line-height:1.5}.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.small-btn{border:1px solid #333;background:#111;color:white;border-radius:12px;padding:12px;font-weight:650}.small-btn.white{background:white;color:black}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.field{margin-top:14px}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid #333;background:#111;color:white;border-radius:12px;padding:13px}.home-return{width:100%;margin-top:12px;border:1px solid #333;background:#0b0b0b;color:#fff;border-radius:14px;padding:14px;font-weight:680;display:flex;justify-content:center;align-items:center;gap:8px}.home-return svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.toast{position:fixed;left:50%;bottom:105px;transform:translate(-50%,20px);opacity:0;background:white;color:black;border-radius:999px;padding:12px 17px;font-weight:700;transition:.2s;z-index:20;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}.toast.show{opacity:1;transform:translate(-50%,0)}.complete{position:fixed;inset:0;background:black;display:none;z-index:30;align-items:center;justify-content:center;text-align:center;padding:24px}.complete.show{display:flex}.checkring{width:112px;height:112px;border:3px solid white;border-radius:50%;display:grid;place-items:center;font-size:58px;margin:auto}.complete h2{font-size:28px;margin:22px 0 8px}.complete p{color:var(--muted);margin:0 0 28px}.complete button{width:100%;max-width:320px;border:0;border-radius:14px;padding:15px;background:white;color:black;font-weight:750;margin-top:10px}.public-wrap{max-width:640px;margin:auto;padding:24px 18px}.public-photo{border-bottom:1px solid #252525;padding:18px 0}.public-photo img{width:100%;border-radius:14px}.public-meta{color:#8e8e93;font-size:12px;margin-top:8px}.loading-card{text-align:center;padding:50px 20px;color:#aaa}input[type=file]{display:none}
</style>
</head>
<body>
<div id="appRoot" class="app">
<header class="top">
  <div class="brand">
    <div class="mark" aria-label="창신체크미 로고">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <g fill="#fff">
          <rect x="45" y="5" width="10" height="42"/>
          <rect x="16" y="28" width="68" height="10"/>
          <polygon points="45,36 52,43 25,70 18,63"/>
          <polygon points="55,36 82,63 75,70 48,43"/>
          <polygon points="47,54 54,61 27,88 20,81"/>
          <polygon points="53,54 80,81 73,88 46,61"/>
        </g>
        <rect x="47.5" y="25" width="5" height="16" fill="#000"/><rect x="42" y="30.5" width="16" height="5" fill="#000"/>
        <path d="M47 57l6 6M53 57l-6 6" stroke="#000" stroke-width="4.5" stroke-linecap="square"/>
        <circle cx="50" cy="87" r="9" fill="#000" stroke="#fff" stroke-width="3"/>
        <path d="M45.5 87l3 3 6-7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="title"><h1>창신체크미</h1><p>WORKSHOP CHECK</p></div>
  </div>
  <button id="quickSettings" class="icon-btn" aria-label="설정 열기 또는 홈으로 돌아가기">
    <svg id="topSettingsIcon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.05.05-2.12 2.12-.05-.05a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20.3h-3v-.08a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.05.05-2.12-2.12.05-.05A1.7 1.7 0 0 0 7 15a1.7 1.7 0 0 0-1.56-1.03h-.08v-3h.08A1.7 1.7 0 0 0 7 9.94a1.7 1.7 0 0 0-.34-1.88l-.05-.05 2.12-2.12.05.05a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 11.69 4.7v-.08h3v.08a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.05-.05 2.12 2.12-.05.05a1.7 1.7 0 0 0-.34 1.88A1.7 1.7 0 0 0 20.94 11h.08v3h-.08A1.7 1.7 0 0 0 19.4 15z"/></svg>
  </button>
</header>
<section id="checkView" class="view active">
<div class="hero">
  <div class="percent"><span id="percent">0</span><small>%</small></div>
  <div id="countText" class="sub">0 / 7 완료</div>
  <div class="journey">
    <div class="journey-icons">
      <svg viewBox="0 0 24 24" aria-label="작업실"><path d="M4 21h16M6 21V8h8v13M14 12h4v9M9 11h2M9 15h2M9 19h2M17 15h1M17 18h1"/></svg>
      <svg viewBox="0 0 24 24" aria-label="집"><path d="M3 11.2 12 4l9 7.2M5.5 10.2V21h13V10.2M9.5 21v-6h5v6"/></svg>
    </div>
    <div class="bar"><div id="progressFill" class="fill"></div></div>
  </div>
  <div class="bar-label"><span>진행률</span><span id="statusText">점검 중</span></div>
</div>
<div class="section-title">항목을 누르면 바로 카메라가 열립니다</div><div id="itemList" class="list"></div>
<div class="controls"><button id="breakBtn" class="control">잠시 외출</button><button id="shareBtn" class="control primary">공유하기</button></div>
<input id="cameraInput" type="file" accept="image/*" capture="environment" />
</section>
<section id="historyView" class="view"><div id="historyList"></div></section>
<section id="settingsView" class="view">
  <div class="card"><h3>작업실 위치</h3><p id="workshopInfo">아직 저장되지 않음</p><div class="field"><label>경고 반경</label><input id="radiusInput" type="number" value="120" min="30" max="500" /></div><div class="card-actions"><button id="saveWorkshopBtn" class="small-btn white">현재 위치 저장</button><button id="clearWorkshopBtn" class="small-btn">위치 지우기</button></div></div>
  <div class="card"><h3>잠시 외출</h3><div class="field"><label>기본 시간</label><select id="breakSelect"><option value="30">30분</option><option value="60">1시간</option><option value="120">2시간</option></select></div></div>
  <div class="card"><h3>새 점검</h3><p>현재 점검을 비우고 처음부터 다시 시작합니다.</p><button id="newSessionBtn" class="small-btn white" style="width:100%">새 점검 시작</button></div>
  <button id="settingsHomeBtn" class="home-return"><svg viewBox="0 0 24 24"><path d="M3 11.2 12 4l9 7.2M5.5 10.2V21h13V10.2M9.5 21v-6h5v6"/></svg>홈으로 돌아가기</button>
</section>
</div>
<nav class="tabs" id="tabs"><div class="tabs-in">
<button class="tab active" data-view="checkView"><svg viewBox="0 0 24 24"><path d="M3 11.2 12 4l9 7.2M5.5 10.2V21h13V10.2M9.5 21v-6h5v6"/></svg>홈</button>
<button class="tab" data-view="historyView"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 8h7M8.5 12h7M8.5 16h5"/></svg>기록</button>
<button class="tab" data-view="settingsView"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.05.05-2.12 2.12-.05-.05a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20.3h-3v-.08a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.05.05-2.12-2.12.05-.05A1.7 1.7 0 0 0 7 15a1.7 1.7 0 0 0-1.56-1.03h-.08v-3h.08A1.7 1.7 0 0 0 7 9.94a1.7 1.7 0 0 0-.34-1.88l-.05-.05 2.12-2.12.05.05a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 11.69 4.7v-.08h3v.08a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.05-.05 2.12 2.12-.05.05a1.7 1.7 0 0 0-.34 1.88A1.7 1.7 0 0 0 20.94 11h.08v3h-.08A1.7 1.7 0 0 0 19.4 15z"/></svg>설정</button>
</div></nav>
<div id="toast" class="toast"></div>
<div id="completeScreen" class="complete"><div><div class="checkring">✓</div><h2>모든 항목 완료</h2><p>퇴실 준비가 끝났습니다.</p><button id="completeHistory">기록 보기</button><button id="completeClose">홈으로</button></div></div>
<script type="module" src="app.js"></script>
</body></html>
